<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Дурак: Битва за Махмудовкино</title>
<style>
body { margin:0; background:#87CEEB; font-family:sans-serif; }
#map { width:100%; height:70vh; background:lightgreen; position:relative; }
.location { position:absolute; width:70px; height:70px; background:white; border:3px solid black; 
            border-radius:15px; text-align:center; font-size:30px; cursor:pointer; }
.badge { background:yellow; border-radius:50%; padding:2px 6px; position:absolute; bottom:0; right:0; }
#game { height:30vh; background:#8B4513; display:flex; justify-content:space-around; align-items:center; }
.char { text-align:center; color:white; }
.avatar { width:80px; height:100px; background:gold; border-radius:15px; font-size:50px; line-height:100px; }
.table { width:45%; height:90%; background:#DEB887; border:8px solid #5D3A1A; border-radius:20px; }
.card { width:42px; height:62px; background:white; border:1px solid black; display:inline-block; margin:2px; }
.red { color:red; }
</style>
</head>
<body>

<div id="map">
  <div class="location" style="top:5%; left:10%;" onclick="alert('Игра с Бабкой!')">🏠<div class="badge">10</div></div>
  <div class="location" style="top:5%; left:70%;" onclick="alert('Игра с Царем!')">🏰<div class="badge">3</div></div>
  <div class="location" style="top:65%; left:80%;" onclick="alert('Игра с Комиком!')">🎤<div class="badge">3</div></div>
</div>

<div id="game">
  <div class="char"><div class="avatar">👑</div><div>Ты</div></div>
  <div class="table"><div id="tableCards"></div></div>
  <div class="char"><div class="avatar">👵</div><div>Бабка</div></div>
</div>
