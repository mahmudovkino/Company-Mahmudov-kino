<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAX | MAHMUDOV INTELLECT</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0b0d12;
    color: white;
    height: 100vh;
    overflow: hidden;
}

.app {
    display: flex;
    height: 100vh;
}

/* БОКОВАЯ ПАНЕЛЬ */

.sidebar {
    width: 260px;
    background: #11141b;
    border-right: 1px solid #252936;
    padding: 20px;
    display: flex;
    flex-direction: column;
}

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo h1 {
    font-size: 48px;
    letter-spacing: 4px;
}

.logo p {
    color: #8d93a3;
    font-size: 11px;
    letter-spacing: 2px;
}

.new-chat {
    border: 0;
    border-radius: 12px;
    padding: 14px;
    background: white;
    color: black;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 20px;
}

.new-chat:hover {
    opacity: .85;
}

.mode-title {
    color: #858b9b;
    font-size: 12px;
    margin-bottom: 10px;
}

.mode {
    background: transparent;
    border: 0;
    color: #ddd;
    padding: 12px;
    border-radius: 10px;
    text-align: left;
    cursor: pointer;
    margin-bottom: 5px;
}

.mode:hover,
.mode.active {
    background: #1d222d;
}

.sidebar-bottom {
    margin-top: auto;
}

.settings {
    width: 100%;
    padding: 12px;
    background: #1a1e27;
    color: white;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
}

/* ЧАТ */

.chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.header {
    height: 70px;
    border-bottom: 1px solid #252936;
    display: flex;
    align-items: center;
    padding: 0 25px;
}

.header strong {
    font-size: 20px;
}

.status {
    color: #54d17a;
    font-size: 12px;
    margin-left: 12px;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 30px;
}

.message {
    max-width: 850px;
    margin: 0 auto 20px;
    padding: 16px 18px;
    border-radius: 16px;
    line-height: 1.6;
    white-space: pre-wrap;
}

.user {
    background: #1c2330;
}

.ai {
    background: #12161e;
    border: 1px solid #252936;
}

.message-name {
    font-size: 12px;
    color: #858b9b;
    margin-bottom: 7px;
}

/* ПЕЧАТЬ */

.typing {
    color: #858b9b;
    font-size: 14px;
    margin: 10px auto;
    max-width: 850px;
    display: none;
}

/* ВВОД */

.input-area {
    padding: 15px 25px 25px;
}

.input-box {
    max-width: 850px;
    margin: auto;
    background: #151922;
    border: 1px solid #2a2f3c;
    border-radius: 18px;
    padding: 10px;
    display: flex;
    gap: 8px;
}

textarea {
    flex: 1;
    resize: none;
    background: transparent;
    border: 0;
    outline: none;
    color: white;
    font-size: 16px;
    padding: 10px;
    min-height: 45px;
    max-height: 150px;
}

.input-button {
    width: 45px;
    height: 45px;
    border: 0;
    border-radius: 12px;
    cursor: pointer;
    background: white;
    color: black;
    font-size: 18px;
}

.input-button:hover {
    opacity: .8;
}

.bottom-info {
    text-align: center;
    color: #666d7d;
    font-size: 11px;
    margin-top: 8px;
}

/* МОБИЛЬНЫЙ */

@media (max-width: 700px) {
    .sidebar {
        display: none;
    }

    .messages {
        padding: 15px;
    }

    .message {
        padding: 13px;
    }

    .input-area {
        padding: 10px;
    }

    .header {
        padding: 0 15px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            <h1>MAX</h1>
            <p>MAHMUDOV INTELLECT</p>
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ Новый чат
        </button>

        <div class="mode-title">РЕЖИМЫ MAX</div>

        <button class="mode active" onclick="setMode('Обычный', this)">
            💬 Обычный
        </button>

        <button class="mode" onclick="setMode('Coder', this)">
            💻 Coder
        </button>

        <button class="mode" onclick="setMode('Study', this)">
            📚 Study
        </button>

        <button class="mode" onclick="setMode('Creator', this)">
            🎨 Creator
        </button>

        <div class="sidebar-bottom">
            <button class="settings" onclick="showSettings()">
                ⚙ Настройки
            </button>
        </div>

    </aside>


    <main class="chat">

        <header class="header">
            <strong>MAX</strong>
            <span class="status">● онлайн</span>
        </header>

        <section class="messages" id="messages">

            <div class="message ai">

                <div class="message-name">
                    MAX · MAHMUDOV INTELLECT
                </div>

                Привет! Я MAX.

                Я интеллектуальный помощник проекта MAHMUDOV INTELLECT.

                Могу помогать с программированием, идеями, учёбой и другими задачами.

            </div>

        </section>

        <div class="typing" id="typing">
            MAX печатает...
        </div>

        <section class="input-area">

            <div class="input-box">

                <button
                    class="input-button"
                    onclick="startVoice()"
                    title="Голосовой ввод">
                    🎤
                </button>

                <textarea
                    id="input"
                    placeholder="Напишите сообщение MAX..."
                    onkeydown="handleKey(event)"
                ></textarea>

                <button
                    class="input-button"
                    onclick="sendMessage()"
                    title="Отправить">
                    ➤
                </button>

            </div>

            <div class="bottom-info">
                MAX может ошибаться. Проверяйте важную информацию.
            </div>

        </section>

    </main>

</div>


<script>

let mode = "Обычный";

const input = document.getElementById("input");
const messages = document.getElementById("messages");
const typing = document.getElementById("typing");


/* ОТПРАВКА */

function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    addMessage("Вы", text, "user");

    input.value = "";

    typing.style.display = "block";

    setTimeout(() => {

        typing.style.display = "none";

        const answer = generateAnswer(text);

        addMessage("MAX", answer, "ai");

        saveChat();

    }, 700);
}


/* ДОБАВЛЕНИЕ СООБЩЕНИЯ */

function addMessage(name, text, type) {

    const div = document.createElement("div");

    div.className = "message " + type;

    div.innerHTML = `
        <div class="message-name">${name}</div>
        ${escapeHTML(text)}
    `;

    messages.appendChild(div);

    messages.scrollTop = messages.scrollHeight;
}


/* ПРОСТОЙ ЛОКАЛЬНЫЙ МОЗГ */

function generateAnswer(text) {

    const lower = text.toLowerCase();

    if (lower.includes("привет")) {
        return "Привет! Я MAX. Чем могу помочь?";
    }

    if (lower.includes("как тебя зовут")) {
        return "Меня зовут MAX. Полное название: MAHMUDOV INTELLECT.";
    }

    if (lower.includes("кто ты")) {
        return "Я MAX, интеллектуальный помощник проекта MAHMUDOV INTELLECT.";
    }

    if (mode === "Coder") {
        return "Режим Coder активирован. Опиши задачу, и я помогу спроектировать HTML, CSS или JavaScript.";
    }

    if (mode === "Study") {
        return "Режим Study активирован. Я могу объяснять сложные темы простыми словами.";
    }

    if (mode === "Creator") {
        return "Режим Creator активирован. Могу помогать с идеями, дизайном и созданием проектов.";
    }

    return "Я пока работаю в демонстрационном режиме. Настоящий искусственный интеллект подключается через безопасный сервер и AI API.";
}


/* ЭКРАНИРОВАНИЕ */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* НОВЫЙ ЧАТ */

function newChat() {

    messages.innerHTML = `
        <div class="message ai">
            <div class="message-name">
                MAX · MAHMUDOV INTELLECT
            </div>
            Новый чат создан. Чем могу помочь?
        </div>
    `;

    localStorage.removeItem("maxChat");

}


/* РЕЖИМ */

function setMode(newMode, button) {

    mode = newMode;

    document.querySelectorAll(".mode")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    addMessage(
        "MAX",
        "Режим «" + mode + "» активирован.",
        "ai"
    );

}


/* СОХРАНЕНИЕ */

function saveChat() {

    localStorage.setItem(
        "maxChat",
        messages.innerHTML
    );

}


/* ЗАГРУЗКА */

function loadChat() {

    const saved = localStorage.getItem("maxChat");

    if (saved) {
        messages.innerHTML = saved;
    }

}


/* ENTER */

function handleKey(event) {

    if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        sendMessage();

    }

}


/* ГОЛОСОВОЙ ВВОД */

function startVoice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        alert("Ваш браузер не поддерживает голосовой ввод.");

        return;

    }

    const recognition = new SpeechRecognition();

    recognition.lang = "ru-RU";

    recognition.start();

    recognition.onresult = function(event) {

        input.value =
            event.results[0][0].transcript;

    };

}


/* ОЗВУЧКА */

function speak(text) {

    if (!("speechSynthesis" in window)) {

        alert("Озвучка не поддерживается.");

        return;

    }

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "ru-RU";

    speechSynthesis.speak(speech);

}


/* НАСТРОЙКИ */

function showSettings() {

    alert(
        "MAX SETTINGS\n\n" +
        "Версия: 1.0\n" +
        "Проект: MAHMUDOV INTELLECT\n" +
        "Режим: " + mode
    );

}


loadChat();

</script>

</body>
</html>
